# Unit tests and a release build of the app on every push to main and every pull request. On main, a passing run then
# calls release.yml, which releases the version in Resources/Info.plist if it is new (see there).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels a pull request's run, but never a run on main (its release job may be half way).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test-and-build:
    name: 테스트와 앱 빌드
    # swift-tools-version 6.2 (this package and sindresorhus/DSStore) needs Xcode 26 or later.
    # macos-26 is the Apple Silicon image with Xcode 26.x installed side by side as /Applications/Xcode_<version>.app:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Shared with release.yml. scripts/toolchain.sh then uses the Xcode chosen here.
      - name: Xcode 선택 (26 이상 중 최신 정식 버전)
        run: ./scripts/select-xcode.sh

      - name: 단위 테스트
        run: ./scripts/test.sh

      - name: 앱 빌드 (release, ad-hoc 서명)
        run: ./scripts/build-app.sh release

      - name: 앱 번들 확인
        run: |
          app="build/Finder Presets.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/FinderPresets"

  release:
    name: 릴리스
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
