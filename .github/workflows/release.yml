# Releases the version in Resources/Info.plist. Called by ci.yml after the checks pass on a push to main; nothing else
# starts it, so every release comes from a tested commit on main and a person never pushes a tag.
#
# - Version not released yet: builds FinderPresets-<version>.dmg (+ .sha256) with scripts/make-dmg.sh, signs it for the
#   in-app updater and writes appcast.xml (scripts/make-appcast.sh), tags the commit v<version>, publishes the GitHub
#   release with the notes of .github/release-notes.md, attaches the dmg, its checksum, the same dmg under the fixed name
#   FinderPresets.dmg (+ .sha256) and appcast.xml, then downloads the fixed name and the feed back through
#   https://github.com/<owner>/<repo>/releases/latest/download/ (the README link and the app's SUFeedURL) and checks them.
# - Version already released: nothing to do, unless the app changed since its tag without a new version, which fails.
# - "Re-run failed jobs" on the CI run finishes a run that stopped half way (tag or draft release left behind), and
#   downloads a release that this commit already published again to check it.
#
# In-app updates (Sparkle). Every release carries appcast.xml, the feed that the app's daily check and "업데이트 확인…"
# read through https://github.com/<owner>/<repo>/releases/latest/download/appcast.xml (SUFeedURL in
# Resources/Info.plist). It has one item: this version, its build number (CFBundleVersion, the CI run number), the
# release notes, and the versioned dmg with an EdDSA signature made by Sparkle's sign_update with the repository secret
#   SPARKLE_PRIVATE_KEY           the private EdDSA key, base64, as Sparkle's `generate_keys -x` exports it. Only the
#                                 owner creates and stores it; ci.yml hands it to this workflow, and here only the step
#                                 that signs ("업데이트 피드 만들기") gets its value. The key check only learns whether
#                                 it is set.
# Every run stops in "버전과 릴리스 상태 확인" (scripts/release-check.sh, whose checks pull requests run too, with
# --check) when a tag is newer than the version, another tag's release is unfinished, the release notes are stale, the
# app changed since the tag of its version, or SUPublicEDKey is not the key of the releases that already shipped with
# one (scripts/check-update-key.sh: installed copies would refuse every later update). A run that is going to publish
# (a version that is not released yet, also when re-run) stops
#   - right after that step, before anything is built or tagged, when that secret is empty or when SUPublicEDKey in
#     Resources/Info.plist is not a real public key (the placeholder);
#   - after the dmg is built and before the tag, when the build number is not higher than the one in the feed that is
#     published now (or that feed is missing although a release with Sparkle is out), or when the signature does not
#     verify against the app's own SUPublicEDKey.
# Runs that publish nothing need no key: a version that is already released, and every pull request (ci.yml calls
# this workflow only for pushes to main). After the publish, the fixed-name dmg and the feed are downloaded again through
# the latest link and checked: the feed's one item, its build number against the app inside that dmg, its address,
# length and signature.
#
# Signing and notarization happen only when these repository secrets exist; otherwise only the app is ad-hoc signed,
# the dmg itself is unsigned, nothing is notarized, and the release notes say so. ci.yml hands them over by name too.
#   MACOS_CERTIFICATE_P12_BASE64  Developer ID Application certificate + private key (.p12), base64
#   MACOS_CERTIFICATE_PASSWORD    password of that .p12
#   CODESIGN_IDENTITY             e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY_ID                 App Store Connect API key ID
#   NOTARY_ISSUER_ID              App Store Connect API issuer ID
#   NOTARY_KEY_P8_BASE64          the API key (AuthKey_XXXX.p8), base64
name: Release

on:
  workflow_call:
    # None is `required: true`: a missing secret must not fail the runs on main that release nothing. The step
    # "업데이트 서명 키 확인" decides about SPARKLE_PRIVATE_KEY, with instructions for the owner, and only for runs that
    # publish; without the certificate or notarization secrets the release is ad-hoc signed and not notarized.
    secrets:
      SPARKLE_PRIVATE_KEY:
        description: Sparkle의 EdDSA 개인 키 (generate_keys -x 로 내보낸 base64). appcast.xml 서명에 씁니다.
        required: false
      MACOS_CERTIFICATE_P12_BASE64:
        description: Developer ID Application 인증서와 개인 키(.p12)의 base64. 없으면 ad-hoc 서명입니다.
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        description: 그 .p12 의 암호.
        required: false
      CODESIGN_IDENTITY:
        description: '서명 ID (예: "Developer ID Application: Name (TEAMID)"). 없으면 ad-hoc 서명입니다.'
        required: false
      NOTARY_KEY_ID:
        description: App Store Connect API 키 ID (공증).
        required: false
      NOTARY_ISSUER_ID:
        description: App Store Connect API 발급자 ID (공증).
        required: false
      NOTARY_KEY_P8_BASE64:
        description: App Store Connect API 키(AuthKey_XXXX.p8)의 base64 (공증).
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    name: DMG와 GitHub 릴리스
    # swift-tools-version 6.2 (this package and sindresorhus/DSStore) needs Xcode 26. macos-26 is the Apple Silicon
    # image with Xcode 26.x installed side by side as /Applications/Xcode_<version>.app; scripts/select-xcode.sh picks
    # the newest released 26.x and nothing newer (see there for why):
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    # Two notarization waits (app, then dmg) of up to 30 minutes each, plus the release build.
    timeout-minutes: 90
    permissions:
      contents: write # version tag, gh release create / upload / edit
    # One release at a time; a newer push waits instead of cancelling a release half way.
    concurrency:
      group: finder-presets-release
      cancel-in-progress: false
    steps:
      - name: 체크아웃 (검사한 커밋, 태그 포함)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The decision: which version, whether it is already released, whether this run publishes and verifies, and that
      # nothing is released backwards or beside an unfinished release (scripts/release-check.sh; its outputs drive the
      # steps below, and pull requests run the same checks with --check). It also writes the notes' body for the
      # release and the feed to $RUNNER_TEMP/release-body.md.
      - name: 버전과 릴리스 상태 확인
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-check.sh

      # The first thing a run that is going to publish does, before Xcode is selected or anything is built: without the
      # key no update feed can be signed, and a release without a feed, or with a public key that is not the owner's,
      # would leave every installed copy unable to update. Runs that publish nothing skip it.
      # The step is told only whether the secret is set, not its value.
      - name: 업데이트 서명 키 확인
        if: steps.prepare.outputs.publish == 'true'
        env:
          HAS_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          if [[ "$HAS_PRIVATE_KEY" != true ]]; then
            echo "::error::저장소 시크릿 SPARKLE_PRIVATE_KEY 가 없어 $TAG 릴리스를 여기서 멈췄습니다 (이 실행은 아무것도 만들거나 올리지 않았습니다). 저장소 소유자가 할 일: (1) swift package resolve 뒤 .build/artifacts/sparkle/Sparkle/bin/generate_keys --account finder-presets 로 키를 만듭니다 (이미 만들었다면 같은 명령이 공개 키를 다시 보여 줍니다). (2) 그 공개 키가 Resources/Info.plist 의 SUPublicEDKey 와 같은지 확인합니다. (3) 개인 키를 저장소 밖의 파일로 내보내 시크릿으로 등록합니다: KEY_FILE=\"\$HOME/finder-presets-update-key.txt\"; (umask 077; .build/artifacts/sparkle/Sparkle/bin/generate_keys --account finder-presets -x \"\$KEY_FILE\"); gh secret set SPARKLE_PRIVATE_KEY -R $GITHUB_REPOSITORY < \"\$KEY_FILE\" (파일은 안전한 곳에 백업한 뒤 지웁니다). (4) 이 CI 실행에서 'Re-run failed jobs'를 누릅니다."
            exit 1
          fi
          # The app must carry the owner's real public key (the base64 of 32 bytes), never the placeholder: a copy
          # released with it could never update. The unit tests refuse the placeholder before the merge; this is the
          # same refusal for the release itself.
          key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Resources/Info.plist 2> /dev/null || true)"
          if [[ "$key" == PASTE_* || ! "$key" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "::error::Resources/Info.plist 의 SUPublicEDKey 가 실제 EdDSA 공개 키가 아닙니다 ('$key'). $TAG 를 릴리스하지 않았습니다. 저장소 소유자가 generate_keys --account finder-presets 가 출력한 공개 키를 넣어야 합니다 (Resources/Info.plist 는 앱 파일이라 새 커밋으로 올립니다)."
            exit 1
          fi
          echo "OK  SPARKLE_PRIVATE_KEY 있음, SUPublicEDKey $key"

      # Shared with ci.yml. scripts/toolchain.sh then uses the Xcode chosen here.
      - name: Xcode 선택 (26.x 중 최신 정식 버전)
        if: steps.prepare.outputs.publish == 'true'
        run: ./scripts/select-xcode.sh

      # sign_update from Sparkle's own distribution, pinned by version and checksum (the file is refused when either
      # differs). The version must be the one Package.resolved builds into the app, so the two are raised together.
      # Before the build, so a wrong pin costs no build time.
      - name: Sparkle 도구 받기 (sign_update)
        id: sparkle
        if: steps.prepare.outputs.publish == 'true'
        env:
          SPARKLE_VERSION: 2.10.0
          # sha256 of Sparkle-2.10.0.tar.xz (GitHub's asset digest for https://github.com/sparkle-project/Sparkle/releases/tag/2.10.0)
          SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
        run: |
          if [[ ! -f Package.resolved ]]; then
            echo "::error::Package.resolved 가 없습니다. 앱에 들어가는 Sparkle 버전을 확인할 수 없습니다 (swift package resolve 로 만들어 커밋하세요)."
            exit 1
          fi
          resolved="$(jq -r '.pins[] | select(.identity == "sparkle") | .state.version' Package.resolved)"
          if [[ "$resolved" != "$SPARKLE_VERSION" ]]; then
            echo "::error::Package.resolved 의 Sparkle('$resolved')과 release.yml 의 SPARKLE_VERSION($SPARKLE_VERSION)이 다릅니다. 둘을 같이 올리세요 (SPARKLE_SHA256 도)."
            exit 1
          fi
          dir="$RUNNER_TEMP/sparkle-$SPARKLE_VERSION"
          rm -rf "$dir"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $dir/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf "$dir/sparkle.tar.xz" -C "$dir" ./bin/sign_update
          # It must start on this runner (no key is involved).
          "$dir/bin/sign_update" --help > /dev/null
          echo "bin=$dir/bin" >> "$GITHUB_OUTPUT"

      - name: 서명 인증서 가져오기 (시크릿이 있을 때만)
        id: signing
        if: steps.prepare.outputs.publish == 'true'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          if [[ -z "$CERTIFICATE_P12_BASE64" || -z "$IDENTITY" ]]; then
            echo "서명 시크릿(MACOS_CERTIFICATE_P12_BASE64, CODESIGN_IDENTITY)이 없어 ad-hoc 서명으로 만듭니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/finder-presets-signing.keychain-db"
          certificate="$RUNNER_TEMP/finder-presets-certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_P12_BASE64" | tr -d ' \r\n' | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Search the temporary keychain first and keep the existing ones.
          search_list=("$keychain")
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line#\"}"
            line="${line%\"}"
            if [[ -n "$line" ]]; then search_list+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search_list[@]}"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          if [[ "$identities" != *"$IDENTITY"* ]]; then
            echo "::error::가져온 인증서에서 CODESIGN_IDENTITY 와 맞는 서명 ID를 찾지 못했습니다. ($(tail -n 1 <<< "$identities"))"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: 공증 키 준비 (시크릿이 있을 때만)
        id: notary
        if: steps.prepare.outputs.publish == 'true'
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          if [[ -z "$KEY_ID" || -z "$ISSUER_ID" || -z "$KEY_P8_BASE64" ]]; then
            echo "공증 시크릿(NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY_P8_BASE64)이 없어 공증을 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$SIGNING_ENABLED" != true ]]; then
            echo "::warning::공증 시크릿은 있지만 서명 시크릿이 없어 공증을 건너뜁니다 (공증에는 Developer ID 서명이 필요합니다)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/finder-presets-notary"
          mkdir -p "$dir"
          chmod 700 "$dir"
          (umask 077 && printf '%s' "$KEY_P8_BASE64" | tr -d ' \r\n' | base64 --decode > "$dir/AuthKey.p8")
          {
            echo "enabled=true"
            echo "key_path=$dir/AuthKey.p8"
          } >> "$GITHUB_OUTPUT"

      - name: DMG 만들기
        id: dmg
        if: steps.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          APP_BUILD: ${{ github.run_number }}
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.enabled == 'true' && secrets.CODESIGN_IDENTITY || '-' }}
          NOTARY_KEY_ID: ${{ steps.notary.outputs.enabled == 'true' && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER_ID: ${{ steps.notary.outputs.enabled == 'true' && secrets.NOTARY_ISSUER_ID || '' }}
          NOTARY_KEY_PATH: ${{ steps.notary.outputs.key_path }}
          NOTARY_TIMEOUT: 30m
        run: ./scripts/make-dmg.sh "$VERSION"

      # Apple Silicon only (the owner's choice; the feed's item asks for arm64 too): the executable of the app that went
      # into the dmg must be exactly arm64. The bundled Sparkle.framework is universal and is not checked.
      - name: 아키텍처 확인 (arm64만)
        if: steps.prepare.outputs.publish == 'true'
        env:
          APP: ${{ steps.dmg.outputs.app }}
        run: |
          [[ -n "$APP" && -x "$APP/Contents/MacOS/FinderPresets" ]] || { echo "::error::방금 만든 앱을 찾지 못했습니다 (make-dmg.sh 의 app 출력: '$APP')."; exit 1; }
          archs="$(lipo -archs "$APP/Contents/MacOS/FinderPresets")"
          [[ "$archs" == arm64 ]] || { echo "::error::앱 실행 파일은 arm64 로만 빌드되어야 합니다 (지금: $archs). 릴리스하지 않았습니다."; exit 1; }
          echo "OK  arm64 ($APP)"

      # Sparkle offers a build only when its number is higher than the installed copy's, and never installs a lower
      # one. The number is this CI run's, which only grows — unless ci.yml is renamed or recreated, which restarts the
      # count. So before anything is tagged, compare with the feed that installed copies read now:
      #   200 with an integer sparkle:version  this build must be higher, otherwise stop
      #   404, and no published release has    no feed yet: the first release with Sparkle (the releases before it,
      #   shipped with an update key           0.1.0 to 0.2.1, have no appcast.xml); go on
      #   404, but a release with Sparkle is   stop: installed copies exist, and the number they compare with is
      #   out (sparkle_release names it)       unknown (the latest release lost its feed, or was made by hand)
      #   anything else (network error, 5xx,   stop: without the published number the comparison cannot be made.
      #   a feed that cannot be read)          Nothing is tagged yet, so "Re-run failed jobs" tries again
      # Whether a release with Sparkle is out is not guessed from the 404: scripts/check-update-key.sh read it from the
      # published releases and their tags (sparkle_release: the newest one whose Info.plist has a real SUPublicEDKey).
      - name: 빌드 번호 확인 (지난 릴리스보다 커야 함)
        if: steps.prepare.outputs.publish == 'true'
        env:
          APP: ${{ steps.dmg.outputs.app }}
          FEED: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          SPARKLE_RELEASE: ${{ steps.prepare.outputs.sparkle_release }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [[ -n "$APP" && -f "$APP/Contents/Info.plist" ]] || fail "방금 만든 앱을 찾지 못했습니다 (make-dmg.sh 의 app 출력: '$APP')."
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          [[ "$build" =~ ^[1-9][0-9]*$ ]] || fail "CFBundleVersion 이 정수가 아닙니다 ('$build'). Sparkle은 이 값을 비교합니다."
          published="$RUNNER_TEMP/published-appcast.xml"
          rm -f "$published"
          # Without -f, so the status is read instead of guessed; curl prints 000 when there was no answer at all.
          status="$(curl -sSL --retry 3 -o "$published" -w '%{http_code}' "$FEED" || true)"
          if [[ "$status" == 404 ]]; then
            if [[ -n "$SPARKLE_RELEASE" ]]; then
              fail "지금 발행된 appcast.xml 이 없습니다 (HTTP 404, $FEED). 그런데 $SPARKLE_RELEASE 는 업데이트 기능(Sparkle)이 들어간 채 이미 릴리스되었습니다. 설치된 앱이 비교하는 빌드 번호를 알 수 없어 릴리스하지 않았습니다. 최신 릴리스에 appcast.xml 이 있는지 확인하세요 (손으로 만든 릴리스가 최신이 되었거나 파일이 지워졌을 수 있습니다)."
            fi
            echo "::notice::발행된 appcast.xml 이 아직 없습니다 (HTTP 404). 업데이트 키가 들어간 릴리스도 아직 없으므로, Sparkle을 넣은 첫 릴리스로 보고 빌드 번호 $build 를 그대로 씁니다."
            exit 0
          fi
          [[ "$status" == 200 ]] || fail "지금 발행된 appcast.xml 을 받지 못했습니다 (HTTP $status, $FEED). 빌드 번호를 비교할 수 없어 릴리스하지 않았습니다. 잠시 뒤 'Re-run failed jobs'로 다시 실행하세요."
          previous="$(xmllint --xpath 'string(//item/*[local-name()="version"])' "$published" 2> /dev/null || true)"
          [[ "$previous" =~ ^[0-9]+$ ]] || fail "지금 발행된 appcast.xml 에서 빌드 번호(sparkle:version)를 읽지 못했습니다 ('$previous', $FEED). 빌드 번호를 비교할 수 없어 릴리스하지 않았습니다."
          if (( 10#$build <= 10#$previous )); then
            fail "이 빌드 번호($build)가 지금 발행된 릴리스의 빌드 번호($previous)보다 크지 않습니다. 설치된 앱이 업데이트로 보지 않으므로 릴리스하지 않았습니다. CI 실행 번호가 다시 시작됐는지(ci.yml 이름 변경 등) 확인하세요."
          fi
          echo "OK  빌드 번호 $build > 지금 발행된 $previous"

      # Before the tag, so a key that is not the pair of SUPublicEDKey never leaves a tag behind. The item points at the
      # versioned dmg (never the fixed name FinderPresets.dmg, which a later release replaces); the two files are the
      # same bytes, so the signature fits both. The only step that gets the private key's value, and in it only
      # make-appcast.sh: the shell takes the key out of its environment first, so rm, mkdir and cat start without it.
      - name: 업데이트 피드 만들기 (appcast.xml)
        id: appcast
        if: steps.prepare.outputs.publish == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_BIN: ${{ steps.sparkle.outputs.bin }}
          APP: ${{ steps.dmg.outputs.app }}
          DMG: ${{ steps.dmg.outputs.dmg }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          key="$SPARKLE_PRIVATE_KEY"
          unset SPARKLE_PRIVATE_KEY
          dir="$RUNNER_TEMP/finder-presets-appcast"
          rm -rf "$dir"
          mkdir -p "$dir"
          SPARKLE_PRIVATE_KEY="$key" ./scripts/make-appcast.sh "$APP" "$DMG" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${DMG##*/}" "$RUNNER_TEMP/release-body.md" "$dir/appcast.xml"
          unset key
          cat "$dir/appcast.xml"
          echo "appcast=$dir/appcast.xml" >> "$GITHUB_OUTPUT"

      # Only after the dmg is built, its build number checked and the feed signed and verified, so a failed build or feed
      # never leaves a tag behind. The token is handed to this one git command (the checkout keeps no credentials), the
      # way actions/checkout itself authenticates.
      - name: 버전 태그 만들기
        if: steps.prepare.outputs.publish == 'true' && steps.prepare.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" --cleanup=verbatim -F .github/release-notes.md "$GITHUB_SHA"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "refs/tags/$TAG"

      - name: GitHub 릴리스 올리기
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_STATE: ${{ steps.prepare.outputs.release_state }}
          DMG: ${{ steps.dmg.outputs.dmg }}
          SHA: ${{ steps.dmg.outputs.sha256 }}
          SIGNED: ${{ steps.dmg.outputs.signed }}
          NOTARIZED: ${{ steps.dmg.outputs.notarized }}
          APPCAST: ${{ steps.appcast.outputs.appcast }}
        run: |
          # The same dmg under a fixed name, with its own checksum line (shasum -c works on the downloaded file).
          latest="$RUNNER_TEMP/finder-presets-latest"
          rm -rf "$latest"
          mkdir -p "$latest"
          cp "$DMG" "$latest/FinderPresets.dmg"
          (cd "$latest" && shasum -a 256 FinderPresets.dmg > FinderPresets.dmg.sha256)
          assets=("$DMG" "$SHA" "$latest/FinderPresets.dmg" "$latest/FinderPresets.dmg.sha256" "$APPCAST")
          notes="$RUNNER_TEMP/release-notes.md"
          {
            cat "$RUNNER_TEMP/release-body.md"
            echo
            echo "## Install"
            echo
            echo "Open \`${DMG##*/}\` and drag **Finder Presets** to **Applications**. Apple Silicon, macOS 14 or later."
            echo
            echo "Already have 0.3.0 or later? Choose **Finder Presets → Check for Updates…** instead."
            echo
            if [[ "$NOTARIZED" == true ]]; then
              echo "Signed with a Developer ID and notarized by Apple."
            elif [[ "$SIGNED" == true ]]; then
              echo "> Signed with a Developer ID but **not notarized**. If macOS blocks the first launch, choose System Settings → Privacy & Security → Open Anyway."
            else
              echo "> Ad-hoc signed and **not notarized**. If macOS blocks the first launch, choose System Settings → Privacy & Security → Open Anyway."
            fi
            echo
            echo "SHA-256 (\`${DMG##*/}\`): \`$(cut -d' ' -f1 < "$SHA")\`"
            echo
            echo "\`FinderPresets.dmg\` is the same file under a fixed name. Latest version, always: https://github.com/$GH_REPO/releases/latest/download/FinderPresets.dmg"
          } > "$notes"
          title="Finder Presets $VERSION"
          if [[ "$RELEASE_STATE" == none ]]; then
            gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file "$notes"
          fi
          is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != true ]]; then
            echo "::error::$TAG 릴리스가 초안이 아닙니다 (isDraft: '$is_draft'). 이미 공개된 릴리스는 건드리지 않습니다."
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --title "$title" --notes-file "$notes" --draft=false --prerelease=false --latest

      - name: README 링크와 업데이트 피드 다시 받아 확인
        if: steps.prepare.outputs.verify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          # Both empty on a re-run that built nothing (the release was published by an earlier attempt).
          DMG: ${{ steps.dmg.outputs.dmg }}
          BUILT_FEED: ${{ steps.appcast.outputs.appcast }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          dir="$(mktemp -d "$RUNNER_TEMP/finder-presets-verify.XXXXXX")"
          # The downloaded dmg is attached further down, to read the released app's Info.plist; the mount never
          # outlives the step (detaching fails quietly when nothing is attached, the usual case).
          mount_dir="$dir/mount"
          trap 'hdiutil detach -quiet -force "$mount_dir" 2> /dev/null || true; rm -rf -- "$dir"' EXIT
          cd "$dir"
          server="https://github.com/$GITHUB_REPOSITORY/releases"
          # The README link and the app's feed serve the latest release, so that is where the files are downloaded
          # from. Only a re-run for a version that a newer published release has superseded checks that version's own
          # copies instead (the latest link will never serve them again), and says so. When the latest release is not
          # known, or is not a newer one, the latest link is checked and must serve this release.
          base="$server/latest/download"
          expected=""
          if [[ -z "$DMG" ]]; then
            newer() {   # newer A B: version A > version B (X.Y.Z)
              local i a b
              IFS=. read -r -a a <<< "$1"
              IFS=. read -r -a b <<< "$2"
              for i in 0 1 2; do
                if (( 10#${a[i]} > 10#${b[i]} )); then return 0; fi
                if (( 10#${a[i]} < 10#${b[i]} )); then return 1; fi
              done
              return 1
            }
            latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' || true)"
            if [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && newer "${latest_tag#v}" "$VERSION"; then
              base="$server/download/$TAG"
              echo "::notice::더 새로운 릴리스 $latest_tag 가 최신입니다. 최신 링크 대신 $TAG 자체의 파일($base)을 확인합니다."
            fi
            # `|| true`: when the file cannot be downloaded, the message below is the one to show, not curl's own.
            expected="$(curl -fsSL "$server/download/$TAG/FinderPresets-$VERSION.dmg.sha256" | cut -d' ' -f1 || true)"
            [[ -n "$expected" ]] || fail "$TAG 의 체크섬 파일을 받지 못했습니다."
          fi
          # Empty when the feed cannot be read or has no such value; the checks below then say what is wrong.
          feed_value() { xmllint --xpath "string($1)" appcast.xml 2> /dev/null || true; }
          same_dmg() { # the download is the dmg of this release: built in this run, or matching the release's checksum
            if [[ -n "$DMG" ]]; then cmp -s FinderPresets.dmg "$DMG"; else [[ "$(shasum -a 256 FinderPresets.dmg | cut -d' ' -f1)" == "$expected" ]]; fi
          }
          same_feed() { # the download is the feed of this release: the file this run built, or one about this version
            if [[ -n "$BUILT_FEED" ]]; then cmp -s appcast.xml "$BUILT_FEED"; else [[ "$(feed_value '//item/*[local-name()="shortVersionString"]')" == "$VERSION" ]]; fi
          }
          # The latest link can lag a few minutes behind the publish (about 2.5 minutes on 2026-10-02), and not for
          # every file at the same moment: the previous release has a dmg and a feed under the same names, so their
          # downloads succeed too. Try again every 30 seconds, ten times in all (about five minutes), until both are
          # this release's; each attempt logs its number and the HTTP status of each file. After the last attempt the
          # checks below say which one is not.
          # The release itself is published by now; a failure here only means it was not verified, so the job is re-run
          # on the same commit (gh run rerun <run-id> --failed), which only verifies again.
          rerun="릴리스 $TAG 는 이미 발행되었습니다. 같은 커밋에서 실패한 작업을 다시 실행하면(gh run rerun <run-id> --failed) 이 확인만 다시 합니다."
          attempts=10
          fetched=false
          for (( attempt = 1; attempt <= attempts; attempt++ )); do
            rm -f FinderPresets.dmg FinderPresets.dmg.sha256 appcast.xml
            fetched=true
            statuses=""
            for file in FinderPresets.dmg FinderPresets.dmg.sha256 appcast.xml; do
              # Without -f, so the status is read instead of guessed; curl prints 000 when there was no answer at all.
              status="$(curl -sSL -o "$file" -w '%{http_code}' "$base/$file" || true)"
              statuses="$statuses $file: HTTP ${status:-000}"
              [[ "$status" == 200 ]] || fetched=false
            done
            if [[ $fetched == true ]] && same_dmg && same_feed; then
              echo "시도 $attempt/$attempts:$statuses — $TAG 의 파일입니다."
              break
            fi
            echo "시도 $attempt/$attempts:$statuses — 아직 $TAG 의 파일이 아니거나 받지 못했습니다."
            if (( attempt < attempts )); then sleep 30; fi
          done
          [[ $fetched == true ]] || fail "$base 에서 DMG·체크섬·appcast.xml 가운데 받아지지 않는 것이 있습니다. $rerun"
          same_dmg || fail "$base/FinderPresets.dmg 가 $TAG 의 DMG와 다릅니다. $rerun"
          shasum -a 256 -c FinderPresets.dmg.sha256
          hdiutil verify -quiet FinderPresets.dmg
          echo "OK  $base/FinderPresets.dmg ($TAG)"

          # The feed the installed copies read: the one this run uploaded, about this version, pointing at this
          # release's versioned dmg, with a signature the installed copies accept (SUPublicEDKey of this commit). The
          # signature is checked over the download above: the fixed-name dmg is the same file as the versioned one.
          xmllint --noout appcast.xml || fail "$base/appcast.xml 이 올바른 XML이 아닙니다."
          if [[ -n "$BUILT_FEED" ]] && ! cmp -s appcast.xml "$BUILT_FEED"; then
            fail "$base/appcast.xml 이 이번 실행에서 만들어 올린 것과 다릅니다. $rerun"
          fi
          feed_build="$(feed_value '//item/*[local-name()="version"]')"
          short="$(feed_value '//item/*[local-name()="shortVersionString"]')"
          url="$(feed_value '//item/enclosure/@url')"
          length="$(feed_value '//item/enclosure/@length')"
          signature="$(feed_value '//item/enclosure/@*[local-name()="edSignature"]')"
          [[ "$(feed_value 'count(//item)')" == 1 ]] || fail "appcast.xml 에 항목이 하나가 아닙니다."
          [[ "$feed_build" =~ ^[1-9][0-9]*$ ]] || fail "appcast.xml 의 빌드 번호(sparkle:version)가 정수가 아닙니다: '$feed_build'"
          [[ "$short" == "$VERSION" ]] || fail "appcast.xml 의 버전이 '$short' 입니다 ($VERSION 이어야 합니다). $rerun"
          [[ "$url" == "$server/download/$TAG/FinderPresets-$VERSION.dmg" ]] || fail "appcast.xml 의 다운로드 주소가 다릅니다: '$url'"
          [[ "$length" == "$(stat -f %z FinderPresets.dmg)" ]] || fail "appcast.xml 의 파일 크기($length)가 받은 DMG와 다릅니다."
          # The feed's build number is the released app's own CFBundleVersion, read from the downloaded dmg. Sparkle
          # compares the two: with a higher number in the feed an installed copy would be offered this update again
          # after every install, with a lower one never.
          mkdir "$mount_dir"
          hdiutil attach -quiet -readonly -nobrowse -noautoopen -mountpoint "$mount_dir" FinderPresets.dmg \
            || fail "받은 DMG를 열지 못했습니다(hdiutil attach)."
          app_plist="$mount_dir/Finder Presets.app/Contents/Info.plist"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_plist" 2> /dev/null || true)"
          app_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_plist" 2> /dev/null || true)"
          # Apple Silicon only: the released app's own executable (not the universal Sparkle.framework beside it).
          app_archs="$(lipo -archs "$mount_dir/Finder Presets.app/Contents/MacOS/FinderPresets" 2> /dev/null || true)"
          # hdiutil sometimes answers "Resource busy" for a moment: try, wait, try again, then force (read-only mount).
          hdiutil detach -quiet "$mount_dir" \
            || { sleep 2; hdiutil detach -quiet "$mount_dir"; } \
            || hdiutil detach -quiet -force "$mount_dir"
          [[ "$app_version" == "$VERSION" ]] || fail "받은 DMG 안 앱의 버전이 '$app_version' 입니다 ($VERSION 이어야 합니다)."
          [[ "$app_archs" == arm64 ]] || fail "받은 DMG 안 앱의 실행 파일이 arm64 로만 빌드되지 않았습니다 (지금: '$app_archs')."
          [[ "$feed_build" == "$app_build" ]] || fail "appcast.xml 의 빌드 번호($feed_build)가 받은 DMG 안 앱의 빌드 번호(CFBundleVersion '$app_build')와 다릅니다."
          public_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$GITHUB_WORKSPACE/Resources/Info.plist")"
          verified=0
          xcrun swift "$GITHUB_WORKSPACE/scripts/ed25519-verify.swift" "$public_key" FinderPresets.dmg "$signature" || verified=$?
          [[ $verified == 0 ]] || fail "appcast.xml 의 서명이 Resources/Info.plist 의 SUPublicEDKey 로 확인되지 않습니다 (ed25519-verify.swift 종료 코드 $verified)."
          echo "OK  $base/appcast.xml ($short, 빌드 $feed_build, 서명 확인됨)"

      - name: 임시 키체인과 키 파일 지우기
        if: always()
        run: |
          keychain="$RUNNER_TEMP/finder-presets-signing.keychain-db"
          if [[ -e "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -rf "$RUNNER_TEMP/finder-presets-notary" "$RUNNER_TEMP/finder-presets-certificate.p12" "$RUNNER_TEMP/finder-presets-latest" \
            "$RUNNER_TEMP/finder-presets-appcast"
