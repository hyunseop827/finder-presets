# Releases the version in Resources/Info.plist. Called by ci.yml after the tests pass on a push to main; nothing else
# starts it, so every release comes from a tested commit on main and a person never pushes a tag.
#
# - Version not released yet: builds FinderPresets-<version>.dmg (+ .sha256) with scripts/make-dmg.sh, tags the commit
#   v<version>, publishes the GitHub release with the notes of .github/release-notes.md, attaches the dmg, its checksum
#   and the same dmg under the fixed name FinderPresets.dmg (+ .sha256), then downloads the fixed name back through
#   https://github.com/<owner>/<repo>/releases/latest/download/FinderPresets.dmg (the README link) and checks it.
# - Version already released: nothing to do, unless the app changed since its tag without a new version, which fails.
# - "Re-run failed jobs" on the CI run finishes a run that stopped half way (tag or draft release left behind), and
#   downloads a release that this commit already published again to check it.
#
# Signing and notarization happen only when these repository secrets exist; otherwise only the app is ad-hoc signed,
# the dmg itself is unsigned, nothing is notarized, and the release notes say so.
#   MACOS_CERTIFICATE_P12_BASE64  Developer ID Application certificate + private key (.p12), base64
#   MACOS_CERTIFICATE_PASSWORD    password of that .p12
#   CODESIGN_IDENTITY             e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY_ID                 App Store Connect API key ID
#   NOTARY_ISSUER_ID              App Store Connect API issuer ID
#   NOTARY_KEY_P8_BASE64          the API key (AuthKey_XXXX.p8), base64
name: Release

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    name: DMG와 GitHub 릴리스
    # swift-tools-version 6.2 (this package and sindresorhus/DSStore) needs Xcode 26 or later.
    # macos-26 is the Apple Silicon image with Xcode 26.x installed side by side as /Applications/Xcode_<version>.app:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    # Two notarization waits (app, then dmg) of up to 30 minutes each, plus the release build.
    timeout-minutes: 90
    permissions:
      contents: write # version tag, gh release create / upload / edit
    # One release at a time; a newer push waits instead of cancelling a release half way.
    concurrency:
      group: finder-presets-release
      cancel-in-progress: false
    steps:
      - name: 체크아웃 (검사한 커밋, 태그 포함)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 버전과 릴리스 상태 확인
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          fail() { echo "::error::$*"; exit 1; }
          # Files that make up the app: a change here after a release needs a new version.
          app_inputs=(Sources Resources Package.swift Package.resolved scripts/build-app.sh scripts/make-icon.swift)
          notes=.github/release-notes.md

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$version" =~ $semver ]] || fail "Resources/Info.plist 의 CFBundleShortVersionString 형식이 잘못되었습니다: '$version' (예: 1.2.0)"
          tag="v$version"

          [[ "$(git rev-parse 'HEAD^{commit}')" == "$GITHUB_SHA" ]] || fail "체크아웃한 커밋이 테스트한 커밋과 다릅니다."
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || fail "main 에 없는 커밋은 릴리스하지 않습니다."

          # Never release backwards: no existing vX.Y.Z tag may be newer than this version.
          newer() {   # newer A B: A > B for X.Y.Z (bash 3.2)
            local i a b
            IFS=. read -r -a a <<< "$1"
            IFS=. read -r -a b <<< "$2"
            for i in 0 1 2; do
              if (( 10#${a[i]} > 10#${b[i]} )); then return 0; fi
              if (( 10#${a[i]} < 10#${b[i]} )); then return 1; fi
            done
            return 1
          }
          tags="$(git tag --list 'v*')"
          while IFS= read -r known; do
            [[ "$known" =~ ^v ]] && [[ "${known#v}" =~ $semver ]] || continue
            if newer "${known#v}" "$version"; then
              fail "$tag 가 이미 있는 $known 보다 낮습니다. Resources/Info.plist 의 버전을 올리세요."
            fi
          done <<< "$tags"

          # Release notes: '# vX.Y.Z' on the first line, then what changed.
          [[ -f "$notes" ]] || fail "$notes 가 없습니다."
          first="$(head -n 1 "$notes" | tr -d '\r')"
          [[ "${first%"${first##*[![:space:]]}"}" == "# $tag" ]] || fail "$notes 의 첫 줄은 '# $tag' 이어야 합니다 (지금: '$first')."
          body="$(tail -n +2 "$notes")"
          [[ -n "${body//[[:space:]]/}" ]] || fail "$notes 에 바뀐 점을 적으세요."
          printf '%s\n' "$body" > "$RUNNER_TEMP/release-body.md"

          tag_commit=""
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          fi
          # Drafts carry their future tag name too; the API call fails loudly instead of reading as "no release".
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | [.tag_name, (.draft | tostring)] | @tsv')"
          release_state=none
          while IFS=$'\t' read -r name draft; do
            [[ "$name" == "$tag" ]] || continue
            if [[ "$draft" == true ]]; then
              [[ "$release_state" == published ]] || release_state=draft
            else
              release_state=published
            fi
          done <<< "$releases"

          publish=true
          verify=true
          if [[ "$release_state" == published ]]; then
            [[ -n "$tag_commit" ]] || fail "릴리스 $tag 는 있는데 태그를 찾지 못했습니다."
            set +e
            git diff --quiet "$tag_commit" HEAD -- "${app_inputs[@]}"
            changed=$?
            set -e
            case $changed in
              0) ;;
              1) fail "$tag 릴리스 뒤에 앱이 바뀌었습니다. Resources/Info.plist 의 버전을 올리고 $notes 를 새 버전으로 고치세요." ;;
              *) fail "$tag 와 지금 커밋을 비교하지 못했습니다." ;;
            esac
            publish=false
            # A re-run of the commit that published it checks the download again (menu-pulse does the same).
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then verify=false; fi
            echo "$tag 는 이미 릴리스되었고 그 뒤로 앱은 바뀌지 않았습니다. 새로 올릴 것이 없습니다."
          elif [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            fail "태그 $tag 가 다른 커밋(${tag_commit:0:7})에 있고 아직 릴리스되지 않았습니다. 그 커밋의 CI 실행에서 'Re-run failed jobs'로 마치거나, 버전을 올리세요. 태그는 옮기지 않습니다."
          else
            echo "$tag 를 릴리스합니다 (태그: $([[ -n "$tag_commit" ]] && echo 있음 || echo 없음), 릴리스: $release_state)."
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "verify=$verify"
            echo "tag_exists=$([[ -n "$tag_commit" ]] && echo true || echo false)"
            echo "release_state=$release_state"
          } >> "$GITHUB_OUTPUT"

      # Shared with ci.yml. scripts/toolchain.sh then uses the Xcode chosen here.
      - name: Xcode 선택 (26 이상 중 최신 정식 버전)
        if: steps.prepare.outputs.publish == 'true'
        run: ./scripts/select-xcode.sh

      - name: 서명 인증서 가져오기 (시크릿이 있을 때만)
        id: signing
        if: steps.prepare.outputs.publish == 'true'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          if [[ -z "$CERTIFICATE_P12_BASE64" || -z "$IDENTITY" ]]; then
            echo "서명 시크릿(MACOS_CERTIFICATE_P12_BASE64, CODESIGN_IDENTITY)이 없어 ad-hoc 서명으로 만듭니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/finder-presets-signing.keychain-db"
          certificate="$RUNNER_TEMP/finder-presets-certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_P12_BASE64" | tr -d ' \r\n' | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Search the temporary keychain first and keep the existing ones.
          search_list=("$keychain")
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line#\"}"
            line="${line%\"}"
            if [[ -n "$line" ]]; then search_list+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search_list[@]}"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          if [[ "$identities" != *"$IDENTITY"* ]]; then
            echo "::error::가져온 인증서에서 CODESIGN_IDENTITY 와 맞는 서명 ID를 찾지 못했습니다. ($(tail -n 1 <<< "$identities"))"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: 공증 키 준비 (시크릿이 있을 때만)
        id: notary
        if: steps.prepare.outputs.publish == 'true'
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          if [[ -z "$KEY_ID" || -z "$ISSUER_ID" || -z "$KEY_P8_BASE64" ]]; then
            echo "공증 시크릿(NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY_P8_BASE64)이 없어 공증을 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$SIGNING_ENABLED" != true ]]; then
            echo "::warning::공증 시크릿은 있지만 서명 시크릿이 없어 공증을 건너뜁니다 (공증에는 Developer ID 서명이 필요합니다)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/finder-presets-notary"
          mkdir -p "$dir"
          chmod 700 "$dir"
          (umask 077 && printf '%s' "$KEY_P8_BASE64" | tr -d ' \r\n' | base64 --decode > "$dir/AuthKey.p8")
          {
            echo "enabled=true"
            echo "key_path=$dir/AuthKey.p8"
          } >> "$GITHUB_OUTPUT"

      - name: DMG 만들기
        id: dmg
        if: steps.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          APP_BUILD: ${{ github.run_number }}
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.enabled == 'true' && secrets.CODESIGN_IDENTITY || '-' }}
          NOTARY_KEY_ID: ${{ steps.notary.outputs.enabled == 'true' && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER_ID: ${{ steps.notary.outputs.enabled == 'true' && secrets.NOTARY_ISSUER_ID || '' }}
          NOTARY_KEY_PATH: ${{ steps.notary.outputs.key_path }}
          NOTARY_TIMEOUT: 30m
        run: ./scripts/make-dmg.sh "$VERSION"

      # Only after the dmg is built, so a failed build never leaves a tag behind. The token is handed to this one
      # git command (the checkout keeps no credentials), the way actions/checkout itself authenticates.
      - name: 버전 태그 만들기
        if: steps.prepare.outputs.publish == 'true' && steps.prepare.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" --cleanup=verbatim -F .github/release-notes.md "$GITHUB_SHA"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "refs/tags/$TAG"

      - name: GitHub 릴리스 올리기
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_STATE: ${{ steps.prepare.outputs.release_state }}
          DMG: ${{ steps.dmg.outputs.dmg }}
          SHA: ${{ steps.dmg.outputs.sha256 }}
          SIGNED: ${{ steps.dmg.outputs.signed }}
          NOTARIZED: ${{ steps.dmg.outputs.notarized }}
        run: |
          # The same dmg under a fixed name, with its own checksum line (shasum -c works on the downloaded file).
          latest="$RUNNER_TEMP/finder-presets-latest"
          rm -rf "$latest"
          mkdir -p "$latest"
          cp "$DMG" "$latest/FinderPresets.dmg"
          (cd "$latest" && shasum -a 256 FinderPresets.dmg > FinderPresets.dmg.sha256)
          assets=("$DMG" "$SHA" "$latest/FinderPresets.dmg" "$latest/FinderPresets.dmg.sha256")
          notes="$RUNNER_TEMP/release-notes.md"
          {
            cat "$RUNNER_TEMP/release-body.md"
            echo
            echo "## Install"
            echo
            echo "Open \`${DMG##*/}\` and drag **Finder Presets** to **Applications**. Apple Silicon, macOS 14 or later."
            echo
            if [[ "$NOTARIZED" == true ]]; then
              echo "Signed with a Developer ID and notarized by Apple."
            elif [[ "$SIGNED" == true ]]; then
              echo "> Signed with a Developer ID but **not notarized**. If macOS blocks the first launch, choose System Settings → Privacy & Security → Open Anyway."
            else
              echo "> Ad-hoc signed and **not notarized**. If macOS blocks the first launch, choose System Settings → Privacy & Security → Open Anyway."
            fi
            echo
            echo "SHA-256 (\`${DMG##*/}\`): \`$(cut -d' ' -f1 < "$SHA")\`"
            echo
            echo "\`FinderPresets.dmg\` is the same file under a fixed name. Latest version, always: https://github.com/$GH_REPO/releases/latest/download/FinderPresets.dmg"
          } > "$notes"
          title="Finder Presets $VERSION"
          if [[ "$RELEASE_STATE" == none ]]; then
            gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file "$notes"
          fi
          is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != true ]]; then
            echo "::error::$TAG 릴리스가 초안이 아닙니다 (isDraft: '$is_draft'). 이미 공개된 릴리스는 건드리지 않습니다."
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --title "$title" --notes-file "$notes" --draft=false --prerelease=false --latest

      - name: README 링크로 다시 받아 확인
        if: steps.prepare.outputs.verify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          DMG: ${{ steps.dmg.outputs.dmg }} # empty on a re-run that built nothing
        run: |
          dir="$(mktemp -d "$RUNNER_TEMP/finder-presets-verify.XXXXXX")"
          trap 'rm -rf -- "$dir"' EXIT
          cd "$dir"
          server="https://github.com/$GITHUB_REPOSITORY/releases"
          # The README link serves the latest release. A re-run for an older version checks that version's own copy.
          base="$server/latest/download"
          expected=""
          if [[ -z "$DMG" ]]; then
            latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' || true)"
            if [[ "$latest_tag" != "$TAG" ]]; then base="$server/download/$TAG"; fi
            expected="$(curl -fsSL "$server/download/$TAG/FinderPresets-$VERSION.dmg.sha256" | cut -d' ' -f1)"
            [[ -n "$expected" ]] || { echo "::error::$TAG 의 체크섬 파일을 받지 못했습니다."; exit 1; }
          fi
          same() {   # the download is the dmg of this release: built in this run, or matching the release's checksum
            if [[ -n "$DMG" ]]; then cmp -s FinderPresets.dmg "$DMG"; else [[ "$(shasum -a 256 FinderPresets.dmg | cut -d' ' -f1)" == "$expected" ]]; fi
          }
          # The latest link can lag a few seconds behind the publish.
          for attempt in 1 2 3 4 5 6; do
            rm -f FinderPresets.dmg FinderPresets.dmg.sha256
            if curl -fsSL -o FinderPresets.dmg "$base/FinderPresets.dmg" \
              && curl -fsSL -o FinderPresets.dmg.sha256 "$base/FinderPresets.dmg.sha256" \
              && same; then
              break
            fi
            if [[ $attempt == 6 ]]; then
              echo "::error::$base/FinderPresets.dmg 가 $TAG 의 DMG와 다르거나 받아지지 않습니다."
              exit 1
            fi
            sleep $((attempt * 10))
          done
          shasum -a 256 -c FinderPresets.dmg.sha256
          hdiutil verify -quiet FinderPresets.dmg
          echo "OK  $base/FinderPresets.dmg ($TAG)"

      - name: 임시 키체인과 키 파일 지우기
        if: always()
        run: |
          keychain="$RUNNER_TEMP/finder-presets-signing.keychain-db"
          if [[ -e "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -rf "$RUNNER_TEMP/finder-presets-notary" "$RUNNER_TEMP/finder-presets-certificate.p12" "$RUNNER_TEMP/finder-presets-latest"
