# Builds FinderPresets-<version>.dmg (+ .sha256) with scripts/make-dmg.sh.
# - push of a v* tag: tests → dmg → workflow artifact → GitHub Release with the dmg and checksum attached, plus the
#   same dmg under the fixed name FinderPresets.dmg (+ FinderPresets.dmg.sha256), so
#   https://github.com/<owner>/<repo>/releases/latest/download/FinderPresets.dmg always serves the latest release
#   (GitHub's "latest" skips pre-releases, so a pre-release's copy is only reachable through its own tag)
# - manual run (workflow_dispatch): tests → dmg → workflow artifact only
#
# Signing and notarization happen only when these repository secrets exist; otherwise only the app is ad-hoc signed,
# the dmg itself is unsigned, nothing is notarized, and the release notes say so.
#   MACOS_CERTIFICATE_P12_BASE64  Developer ID Application certificate + private key (.p12), base64
#   MACOS_CERTIFICATE_PASSWORD    password of that .p12
#   CODESIGN_IDENTITY             e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY_ID                 App Store Connect API key ID
#   NOTARY_ISSUER_ID              App Store Connect API issuer ID
#   NOTARY_KEY_P8_BASE64          the API key (AuthKey_XXXX.p8), base64
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 0.2.0, 0.2.0-beta.1). 비우면 태그 또는 Resources/Info.plist 의 버전'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  dmg:
    name: DMG 만들기
    # swift-tools-version 6.2 (this package and sindresorhus/DSStore) needs Xcode 26 or later.
    # macos-26 is the Apple Silicon image with Xcode 26.x installed side by side as /Applications/Xcode_<version>.app:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    # Two notarization waits (app, then dmg) of up to 30 minutes each, plus tests and the release build.
    timeout-minutes: 90
    permissions:
      contents: write # gh release create / upload
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Shared with ci.yml. scripts/toolchain.sh then uses the Xcode chosen here.
      - name: Xcode 선택 (26 이상 중 최신 정식 버전)
        run: ./scripts/select-xcode.sh

      - name: 버전 정하기
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::버전 형식이 잘못되었습니다 (예: 1.2.0, 1.2.0-beta.1)"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "버전: $version (prerelease: $prerelease)"
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: 단위 테스트
        run: ./scripts/test.sh

      - name: 서명 인증서 가져오기 (시크릿이 있을 때만)
        id: signing
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          if [[ -z "$CERTIFICATE_P12_BASE64" || -z "$IDENTITY" ]]; then
            echo "서명 시크릿(MACOS_CERTIFICATE_P12_BASE64, CODESIGN_IDENTITY)이 없어 ad-hoc 서명으로 만듭니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/finder-presets-signing.keychain-db"
          certificate="$RUNNER_TEMP/finder-presets-certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_P12_BASE64" | tr -d ' \r\n' | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Search the temporary keychain first and keep the existing ones.
          search_list=("$keychain")
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line#\"}"
            line="${line%\"}"
            if [[ -n "$line" ]]; then search_list+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search_list[@]}"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          if [[ "$identities" != *"$IDENTITY"* ]]; then
            echo "::error::가져온 인증서에서 CODESIGN_IDENTITY 와 맞는 서명 ID를 찾지 못했습니다. ($(tail -n 1 <<< "$identities"))"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: 공증 키 준비 (시크릿이 있을 때만)
        id: notary
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          if [[ -z "$KEY_ID" || -z "$ISSUER_ID" || -z "$KEY_P8_BASE64" ]]; then
            echo "공증 시크릿(NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY_P8_BASE64)이 없어 공증을 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$SIGNING_ENABLED" != true ]]; then
            echo "::warning::공증 시크릿은 있지만 서명 시크릿이 없어 공증을 건너뜁니다 (공증에는 Developer ID 서명이 필요합니다)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/finder-presets-notary"
          mkdir -p "$dir"
          chmod 700 "$dir"
          (umask 077 && printf '%s' "$KEY_P8_BASE64" | tr -d ' \r\n' | base64 --decode > "$dir/AuthKey.p8")
          {
            echo "enabled=true"
            echo "key_path=$dir/AuthKey.p8"
          } >> "$GITHUB_OUTPUT"

      - name: DMG 만들기
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_BUILD: ${{ github.run_number }}
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.enabled == 'true' && secrets.CODESIGN_IDENTITY || '-' }}
          NOTARY_KEY_ID: ${{ steps.notary.outputs.enabled == 'true' && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER_ID: ${{ steps.notary.outputs.enabled == 'true' && secrets.NOTARY_ISSUER_ID || '' }}
          NOTARY_KEY_PATH: ${{ steps.notary.outputs.key_path }}
          NOTARY_TIMEOUT: 30m
        run: ./scripts/make-dmg.sh "$VERSION"

      - name: 워크플로 산출물 올리기
        uses: actions/upload-artifact@v7
        with:
          name: FinderPresets-${{ steps.dmg.outputs.version }}
          path: |
            ${{ steps.dmg.outputs.dmg }}
            ${{ steps.dmg.outputs.sha256 }}
          if-no-files-found: error
          compression-level: 0 # the dmg is already compressed

      - name: GitHub Release 만들기
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.dmg.outputs.version }}
          DMG: ${{ steps.dmg.outputs.dmg }}
          SHA: ${{ steps.dmg.outputs.sha256 }}
          SIGNED: ${{ steps.dmg.outputs.signed }}
          NOTARIZED: ${{ steps.dmg.outputs.notarized }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # The same dmg under a fixed name, with its own checksum line (shasum -c works on the downloaded file).
          latest="$RUNNER_TEMP/finder-presets-latest"
          rm -rf "$latest"
          mkdir -p "$latest"
          cp "$DMG" "$latest/FinderPresets.dmg"
          (cd "$latest" && shasum -a 256 FinderPresets.dmg > FinderPresets.dmg.sha256)
          assets=("$DMG" "$SHA" "$latest/FinderPresets.dmg" "$latest/FinderPresets.dmg.sha256")
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Finder Presets $VERSION"
            echo
            echo "\`${DMG##*/}\`를 열고 **Finder Presets**를 **Applications** 폴더로 끌어다 놓으세요. macOS 14 이상, Apple Silicon 전용입니다."
            echo
            if [[ "$NOTARIZED" == true ]]; then
              echo "Developer ID로 서명하고 Apple 공증을 받은 디스크 이미지입니다."
            elif [[ "$SIGNED" == true ]]; then
              echo "> **공증되지 않음** (Developer ID 서명만 됨) — 처음 열 때 시스템 설정 > 개인정보 보호 및 보안 > 그래도 열기"
            else
              echo "> **서명·공증되지 않음** — 처음 열 때 시스템 설정 > 개인정보 보호 및 보안 > 그래도 열기"
              echo ">"
              echo "> ad-hoc 서명만 된 빌드라 macOS가 처음 실행을 막습니다. 앱을 한 번 연 뒤 위 설정 화면에서 \"그래도 열기\"를 누르세요."
            fi
            echo
            echo "SHA-256 (\`${DMG##*/}\`): \`$(cut -d' ' -f1 < "$SHA")\`"
            echo
            if [[ "$PRERELEASE" == true ]]; then
              echo "\`FinderPresets.dmg\`는 같은 파일의 고정 이름 사본입니다. 사전 릴리스라 releases/latest 링크로는 받을 수 없습니다(그 링크는 사전 릴리스가 아닌 최신 릴리스를 가리킵니다)."
            else
              echo "\`FinderPresets.dmg\`는 같은 파일의 고정 이름 사본입니다. 늘 최신 버전을 받는 링크: https://github.com/$GH_REPO/releases/latest/download/FinderPresets.dmg"
            fi
          } > "$notes"
          args=(--title "Finder Presets $VERSION" --notes-file "$notes")
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-run of the same tag: replace the assets (the fixed-name copy included) and the notes.
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" "${args[@]}"
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag "${args[@]}"
          fi

      - name: 임시 키체인과 키 파일 지우기
        if: always()
        run: |
          keychain="$RUNNER_TEMP/finder-presets-signing.keychain-db"
          if [[ -e "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -rf "$RUNNER_TEMP/finder-presets-notary" "$RUNNER_TEMP/finder-presets-certificate.p12" "$RUNNER_TEMP/finder-presets-latest"
